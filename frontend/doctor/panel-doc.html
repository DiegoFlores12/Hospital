<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Doctor | Hospital Mágico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="fondo-animado"></div>
    <div class="dashboard-layout">
        <aside class="sidebar glass-panel">
            <div class="logo-sidebar" onclick="window.location.href='../index.html'"><i class="fa-solid fa-hospital-user"></i> Hospital Mágico</div>
            <nav class="menu-lateral">
                <a href="panel-doc.html" class="menu-item activo"><i class="fa-solid fa-house-medical"></i> Inicio</a>
                <a href="mis-pacientes.html" class="menu-item"><i class="fa-solid fa-hospital-user"></i> Mis Pacientes</a>
            </nav>
            <div class="usuario-sidebar">
                <div class="avatar"><i class="fa-solid fa-user-doctor"></i></div>
                <div class="info-user"><p class="nombre">Doctor</p><p class="rut">Sesión doctor</p></div>
                <button class="btn-salir" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>
        <main class="main-content">
            <div class="header-dashboard"><h2>Panel Médico</h2><p>Revisa tu agenda y accede a los pacientes que has atendido.</p></div>
            <div class="panel-card glass-panel card-destacada">
                <div class="card-header-bento"><h3><i class="fa-solid fa-calendar-check icono-cyan"></i> Agenda de hoy</h3></div>
                <div class="lista-examenes" id="doctor-agenda-hoy"><p style="color: var(--texto-secundario);">Cargando agenda...</p></div>
            </div>
        </main>
    </div>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
